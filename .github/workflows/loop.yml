name: Atualizar projeções (loop)

# Disparado uma vez (Actions → Run workflow), roda a cada 5 minutos por
# ~5h45 e se dispara de novo antes de terminar, até 7/11 (UTC).
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-loop
  cancel-in-progress: true

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atualizar a cada 5 minutos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + 345*60))
          while [ $SECONDS -lt $end ]; do
            if [ "$(date -u +%Y%m%d)" -ge 20261107 ]; then echo "Fim do período."; exit 0; fi
            start=$SECONDS
            git fetch -q origin main && git reset -q --hard origin/main
            if python3 -c "import json,sys;d=json.load(open('data.json'));sys.exit(0 if all(r.get('called') for o in ('senate','governor') for r in d[o].values()) else 1)"; then
              echo "Todas as disputas projetadas."; exit 0
            fi
            echo "::group::Rodada $(date -u +%H:%MZ)"
            python3 scripts/update.py || echo "::warning::rodada falhou"
            if ! git diff --quiet data.json; then
              git add data.json
              git commit -q -m "Atualiza projeções $(date -u +%H:%MZ)"
              for i in 1 2 3; do
                if git push -q origin HEAD:main; then break; fi
                git pull -q --rebase origin main || { git rebase --abort; git reset -q --hard origin/main; break; }
              done
            fi
            echo "::endgroup::"
            wait=$((300 - (SECONDS - start)))
            [ $wait -gt 0 ] && sleep $wait
          done
      - name: Disparar o próximo ciclo
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d)" -lt 20261107 ]; then
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/loop.yml/dispatches" \
              -d '{"ref":"main"}'
          fi
