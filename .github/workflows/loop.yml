name: Atualizar projeções (loop)

# Disparado uma vez (Actions → Run workflow), segue a agenda de
# scripts/interval.py por ~5h45 e se dispara de novo até a agenda acabar.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-loop
  cancel-in-progress: true

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atualizar conforme a agenda
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash scripts/loop.sh
      - name: Disparar o próximo ciclo
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/stop ] && [ "$(python3 scripts/interval.py)" != "STOP" ]; then
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/loop.yml/dispatches" \
              -d '{"ref":"main"}'
          fi
